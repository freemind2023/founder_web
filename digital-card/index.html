<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanmit Shah — Digital Business Card</title>
<meta name="description" content="Official digital business card of Sanmit Shah, Founder, Practical Eduskills.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3A5F;
    --navy-dark:#0E2A47;
    --gold:#F4B23A;
    --gold-light:#FFD27A;
    --gold-dark:#D4941E;
    --paper:#F6F3EC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    background:
      radial-gradient(circle at 15% 10%, rgba(244,178,58,.16), transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(31,58,95,.5), transparent 55%),
      var(--navy-dark);
    color:#fff;
  }

  .card{
    position:relative;
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg, var(--paper) 0%, #EFEAE0 100%);
    border-radius:28px;
    overflow:hidden;
    box-shadow:
      0 40px 80px -20px rgba(0,0,0,.55),
      0 12px 30px -8px rgba(0,0,0,.4),
      0 0 0 1px rgba(244,178,58,.18);
  }

  .card-header{
    background:
      radial-gradient(circle at 20% 0%, rgba(244,178,58,.25), transparent 60%),
      linear-gradient(160deg, var(--navy-dark), var(--navy) 90%);
    padding:28px 24px 64px;
    text-align:center;
    position:relative;
  }

  .brand-logo{
    width:78px;
    height:auto;
    margin:0 auto 4px;
    display:block;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));
  }

  .tagline{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(255,255,255,.55);
    font-weight:600;
  }

  .photo-wrap{
    position:absolute;
    left:50%;
    bottom:-56px;
    transform:translateX(-50%);
    width:112px;
    height:112px;
    border-radius:50%;
    padding:4px;
    background:linear-gradient(140deg, var(--gold-light), var(--gold-dark));
    box-shadow:0 18px 34px -8px rgba(0,0,0,.55), 0 0 0 6px var(--paper);
  }
  .photo-wrap img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:#dcd6c8;
  }

  .card-body{
    padding:68px 28px 8px;
    text-align:center;
  }

  .name{
    font-family:'Playfair Display',serif;
    font-weight:800;
    font-size:24px;
    color:var(--navy-dark);
    letter-spacing:-.01em;
  }
  .role{
    margin-top:4px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold-dark);
  }

  .contact-list{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .contact-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    background:#fff;
    border:1px solid rgba(14,42,71,.08);
    border-radius:14px;
    text-decoration:none;
    color:var(--navy-dark);
    box-shadow:0 2px 0 rgba(14,42,71,.03);
    transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s cubic-bezier(.2,.8,.2,1);
  }
  .contact-row:hover{ transform:translateY(-2px); box-shadow:0 10px 22px -8px rgba(14,42,71,.25); }
  .contact-row:active{ transform:translateY(0); }
  .contact-row:focus-visible{ outline:2px solid var(--gold-dark); outline-offset:2px; }
  .contact-icon{
    width:36px;
    height:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--navy-dark);
    color:var(--gold-light);
    flex-shrink:0;
  }
  .contact-icon svg{ width:18px; height:18px; }
  .contact-text{ text-align:left; min-width:0; }
  .contact-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#8A7F6C; font-weight:700; }
  .contact-value{ font-size:14px; font-weight:600; color:var(--navy-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .social-row{
    margin-top:18px;
    display:flex;
    justify-content:center;
    gap:12px;
  }
  .social-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--navy-dark);
    color:var(--gold-light);
    text-decoration:none;
    box-shadow:0 6px 16px -4px rgba(14,42,71,.4);
    transition:transform .18s cubic-bezier(.2,.8,.2,1), background .18s ease;
  }
  .social-btn svg{ width:19px; height:19px; }
  .social-btn:hover{ transform:translateY(-3px); background:var(--gold-dark); color:var(--navy-dark); }
  .social-btn:focus-visible{ outline:2px solid var(--gold-dark); outline-offset:3px; }

  .company-block{
    margin-top:24px;
    padding-top:18px;
    border-top:1px dashed rgba(14,42,71,.15);
  }
  .company-name{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:16px;
    color:var(--navy-dark);
  }
  .company-sub{
    font-size:12px;
    color:#8A7F6C;
    margin-top:2px;
  }

  .action-row{
    margin-top:22px;
    display:flex;
    gap:10px;
    padding-bottom:26px;
  }
  .btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 10px;
    border-radius:14px;
    font-size:13px;
    font-weight:700;
    letter-spacing:.01em;
    text-decoration:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s cubic-bezier(.2,.8,.2,1);
  }
  .btn svg{ width:16px; height:16px; }
  .btn-primary{
    background:linear-gradient(160deg, var(--gold-light), var(--gold-dark));
    color:var(--navy-dark);
    box-shadow:0 10px 24px -8px rgba(212,148,30,.6);
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 14px 30px -8px rgba(212,148,30,.7); }
  .btn-primary:active{ transform:translateY(0); }
  .btn-primary:focus-visible{ outline:2px solid var(--navy-dark); outline-offset:2px; }
  .btn-secondary{
    background:#fff;
    color:var(--navy-dark);
    border:1px solid rgba(14,42,71,.14);
  }
  .btn-secondary:hover{ transform:translateY(-2px); box-shadow:0 10px 22px -8px rgba(14,42,71,.25); }
  .btn-secondary:active{ transform:translateY(0); }
  .btn-secondary:focus-visible{ outline:2px solid var(--gold-dark); outline-offset:2px; }

  .footer-note{
    text-align:center;
    font-size:11px;
    color:rgba(255,255,255,.4);
    margin-top:18px;
    letter-spacing:.03em;
  }

  @media (max-width:380px){
    .card-body{ padding:64px 20px 8px; }
    .action-row{ flex-direction:column; }
  }
</style>
</head>
<body>

  <div>

      <div class="card-body">

        <div class="contact-list">

          <a class="contact-row" href="mailto:sanmitshah@gmail.com">
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" stroke="none"/><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>

          <a class="contact-row" href="https://wa.me/919890036003" target="_blank" rel="noopener noreferrer">
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.46 3.48 1.34 5L2 22l5.2-1.36a9.94 9.94 0 0 0 4.84 1.23h.01c5.5 0 9.96-4.46 9.96-9.96S17.54 2 12.04 2zm0 18.2h-.01a8.22 8.22 0 0 1-4.19-1.15l-.3-.18-3.09.81.82-3.01-.2-.31a8.2 8.2 0 0 1-1.26-4.4c0-4.55 3.71-8.26 8.27-8.26a8.22 8.22 0 0 1 8.24 8.27c0 4.55-3.71 8.23-8.28 8.23zm4.53-6.17c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.13-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.84-.86 2.05 0 1.21.88 2.38 1 2.54.12.17 1.73 2.64 4.2 3.7.59.25 1.05.4 1.41.52.59.19 1.13.16 1.55.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.11-.23-.17-.48-.29z"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-label">WhatsApp</span>
              <span class="contact-value">+91 98900 36003</span>
            </span>
          </a>
        </div>

        <div class="social-row">
          <a class="social-btn" href="https://www.instagram.com/sanmit_shahofficial/?hl=en" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>

        <div class="action-row">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

          <button class="btn btn-secondary" id="shareBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            Share
          </button>
        </div>
      </div>
    </div>
    <p class="footer-note">© Practical Eduskills — Sanmit Shah</p>

<script>
  document.getElementById('saveContactBtn').addEventListener('click', function () {
    var vcard = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:Shah;Sanmit;;;',
      'FN:Sanmit Shah',
      'ORG:Practical Eduskills',
      'TITLE:Founder',
      'TEL;TYPE=CELL:+919890036003',
      'EMAIL:sanmitshah@gmail.com',
      'URL:https://www.instagram.com/sanmit_shahofficial/',
      'END:VCARD'
    ].join('\n');
    var blob = new Blob([vcard], { type: 'text/vcard' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Sanmit_Shah.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('shareBtn').addEventListener('click', function () {
    var shareData = {
      title: 'Sanmit Shah — Practical Eduskills',
      text: 'Sanmit Shah, Founder, Practical Eduskills',
      url: window.location.href
    };
    if (navigator.share) {
      navigator.share(shareData).catch(function () {});
    } else {
      navigator.clipboard.writeText(window.location.href).then(function () {
        var btn = document.getElementById('shareBtn');
        var original = btn.innerHTML;
        btn.innerHTML = 'Link Copied';
        setTimeout(function () { btn.innerHTML = original; }, 1800);
      });
    }
  });
</script>

</body>
</html>
